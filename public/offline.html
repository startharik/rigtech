<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <title>Rigtech · Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f5; color: #0f172a; }
      main { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { margin-bottom: .5rem; color: #0f766e; }
      p { line-height: 1.6; color: #475569; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Rigtech needs an internet connection to load your workspace. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <style>
      button { border: 0; border-radius: 12px; padding: 12px 18px; background: #0f766e; color: white; font: inherit; font-weight: 650; }
    </style>
  </body>
</html>
