<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7f5">
    <title>Rigtech</title>
  </head>
  <body>
    <main>
      <h1>Rigtech needs an internet connection</h1>
      <p>Connect to the internet, then try opening the app again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f4f7f5; color: #0f172a; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 1.5rem; }
      button { border: 0; border-radius: 12px; padding: 12px 18px; background: #0f766e; color: white; font: inherit; font-weight: 650; }
    </style>
  </body>
</html>
